# AI System Challenge 제출 workflow (모든 팀 공통, AISC_IMAGE만 팀마다 다릅니다)
# 팀 등록 때 AISystemChallenge가 이 파일을 저장소 기본 branch에 commit합니다. 이 workflow는 제출 이미지를 빌드하지 않습니다.
#
# link job (등록): 이 파일이 commit될 때와 Actions 탭에서 Run workflow를 누를 때 실행됩니다.
#   파일이 이미 있으면 등록 중에 대회 시스템이 Run workflow와 같은 실행을 요청합니다.
#   저장소의 GITHUB_TOKEN으로 자리표시 이미지(hello-world 기반) AISC_IMAGE:aisc-registration을 ghcr.io에 push해
#   패키지를 만들고 이 저장소에 연결합니다. aisc-registration tag는 제출이 아닙니다.
#   패키지가 연결되지 않았으면 Run workflow로 다시 실행하고, 실패하면 로그의 안내를 따르세요.
# release job (제출): 직접 빌드한 이미지를 AISC_IMAGE:<tag>로 ghcr.io에 push하면 GitHub의 패키지 이벤트
#   (registry_package)로 실행되어 그 tag 이름의 정식 release를 기본 branch에 만듭니다.
#   대회 시스템은 그 release를 받아 이 저장소에 연결된 패키지에서 같은 tag를 찾아 제출로 접수합니다.
#   건너뛰는 경우: tag 없는 이벤트(같은 push의 플랫폼별 manifest 등), 등록한 이름이 아닌 패키지,
#   latest tag, 자리표시 tag aisc-registration, 같은 tag의 release가 이미 있을 때
#   (같은 tag를 다시 push해도 다시 제출되지 않습니다). docker tag 규칙에 맞지 않는 tag는 오류로 멈춥니다.
name: AI System Challenge submission

# 트리거: 패키지 이벤트는 release job을, 이 파일의 commit(push)과 Actions 탭의 Run workflow(workflow_dispatch)는 link job을 실행합니다.
on:
  registry_package:
    types: [published, updated]
  push:
    paths:
      - .github/workflows/aisc-submission.yml
  workflow_dispatch:

# 권한: contents는 release job이 release를 만들 때, packages는 link job이 자리표시 이미지를 push할 때 씁니다.
permissions:
  contents: write
  packages: write

env:
  # 팀 등록 때 자동 기록. 바꾸면 제출 이미지를 찾지 못합니다.
  AISC_IMAGE: ghcr.io/<owner>/<name>

jobs:
  link:
    runs-on: ubuntu-latest
    # 패키지 이벤트가 아닐 때(이 파일의 commit, Run workflow)만 실행합니다.
    if: ${{ github.event_name != 'registry_package' }}
    steps:
      # GITHUB_TOKEN으로 push하면 패키지가 이 저장소에 연결되고, 그 push는 이 workflow를 다시 실행하지 않습니다.
      - name: Create and link the image package
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          printf 'FROM hello-world\nLABEL org.opencontainers.image.source="%s"\nLABEL org.opencontainers.image.description="AI System Challenge registration placeholder (not a submission)"\n' "$REPO_URL" > Dockerfile.aisc
          docker build -q -f Dockerfile.aisc -t "${AISC_IMAGE}:aisc-registration" .
          if ! docker push -q "${AISC_IMAGE}:aisc-registration"; then
            echo "::error::자리표시 이미지를 push하지 못해 패키지를 이 저장소에 연결하지 못했습니다. ① 같은 이름의 패키지가 이미 있으면(직접 push해 만든 패키지 등) 그 패키지 페이지의 Package settings → Connect repository에서 이 저장소를 연결하세요. 이미 이 저장소에 연결돼 있으면 이 실패는 무시해도 되고 새 tag push는 그대로 제출됩니다. ② 조직 정책이 Actions의 GITHUB_TOKEN으로 패키지를 만들거나 쓰는 것을 막고 있을 수 있습니다. 정책을 고친 뒤 Actions 탭의 Run workflow로 다시 실행하세요."
            exit 1
          fi
          echo "자리표시 tag aisc-registration을 push했습니다(제출이 아닙니다). 저장소 첫 화면 오른쪽 Packages 목록에 패키지가 보이면 연결된 것이고, 이제 새 tag로 push하면 제출됩니다."

  release:
    runs-on: ubuntu-latest
    # 패키지 이벤트 중 tag가 있는 것만 job을 시작합니다(tag 없는 이벤트는 시작하지 않습니다).
    if: ${{ github.event_name == 'registry_package' && github.event.registry_package.package_version.container_metadata.tag.name != '' }}
    steps:
      # 이벤트 값은 env로만 넘깁니다(run 안에 github.event 값을 직접 넣지 않습니다).
      - name: Release the pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PKG_NAME: ${{ github.event.registry_package.name }}
          PKG_TAG: ${{ github.event.registry_package.package_version.container_metadata.tag.name }}
          PKG_DIGEST: ${{ github.event.registry_package.package_version.container_metadata.tag.digest }}
        run: |
          set -euo pipefail
          if [ -z "${PKG_TAG}" ]; then
            echo "tag 없는 이벤트라 건너뜁니다."
            exit 0
          fi
          image="ghcr.io/${OWNER,,}/${PKG_NAME,,}"
          if [ "${image}" != "${AISC_IMAGE}" ]; then
            echo "등록한 이미지가 아니라 건너뜁니다: ${image}"
            exit 0
          fi
          if [[ ! "${PKG_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::push한 tag가 docker tag 규칙(영문·숫자·_ . -, 128자 이하, 첫 글자는 영문·숫자·_)에 맞지 않아 release를 만들지 않습니다."
            exit 1
          fi
          if [ "${PKG_TAG}" = "latest" ]; then
            echo "::notice::latest tag는 제출하지 않습니다. 버전 tag(예: v1.0.0)를 붙여 다시 push하세요."
            exit 0
          fi
          if [ "${PKG_TAG}" = "aisc-registration" ]; then
            echo "::notice::aisc-registration은 등록 때 패키지를 연결하는 자리표시 tag라 제출하지 않습니다. 버전 tag(예: v1.0.0)를 붙여 push하세요."
            exit 0
          fi
          if gh release view "${PKG_TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "release ${PKG_TAG}가 이미 있어 건너뜁니다(같은 tag를 다시 push해도 다시 제출되지 않습니다)."
            exit 0
          fi
          branch="$(gh api "repos/${REPO}" --jq .default_branch)"
          gh release create "${PKG_TAG}" --repo "${REPO}" --target "${branch}" --title "${PKG_TAG}" --notes "제출 이미지 ${AISC_IMAGE}:${PKG_TAG} (${PKG_DIGEST}) — GHCR push로 자동 생성"
