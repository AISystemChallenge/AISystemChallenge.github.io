name: Sync Submission Guide

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          ref: AISystemChallenge2026

      - name: Download submission guide
        run: |
          curl -fLsS \
            https://raw.githubusercontent.com/AISystemChallenge/submission-guide/main/README.md \
            -o _includes/submission_guide.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _includes/submission_guide.md
          if ! git diff --cached --quiet; then
            git commit -m "Sync submission guide"
            git push origin HEAD:AISystemChallenge2026
          fi
